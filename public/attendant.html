<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Atendente - SenhaHub</title>
    <link rel="stylesheet" href="styles.css?v=20260821-attendant-sprint-15s" />
  </head>
  <body class="attendant-page">
    <main class="ops-stage">
      <section class="ops-shell">
        <header class="ops-header">
          <div>
            <span>Fila de atendimento</span>
            <h1>Painel do atendente</h1>
          </div>
          <nav>
            <button id="logoutButton">Sair</button>
          </nav>
        </header>
        <div class="ops-grid" id="attendantSectors"></div>
      </section>
      <div class="skip-modal" id="skipModal" hidden>
        <form class="skip-card" id="skipForm" data-online-required>
          <strong>Pular senha</strong>
          <p>Informe o motivo para registrar a excecao na ordem de atendimento.</p>
          <label><input type="radio" name="reason" value="cliente_ausente" required /> Cliente ausente</label>
          <label><input type="radio" name="reason" value="cancelamento" /> Cancelamento</label>
          <label><input type="radio" name="reason" value="erro_operacional" /> Erro operacional</label>
          <div>
            <button type="button" class="soft-action" id="skipCancel">Voltar</button>
            <button class="yellow-action">Confirmar</button>
          </div>
        </form>
      </div>
    </main>
    <script src="attendant.js?v=20260821-attendant-logout-fix"></script>
  </body>
</html>
