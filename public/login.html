<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SenhaHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="senhahub-auth-stage">
      <section class="senhahub-auth-hero" aria-label="SenhaHub Super Pompeia">
        <div class="senhahub-auth-brand">
          <img class="senhahub-auth-market-logo" src="/assets/mercado-pompeia-logo.jpg" alt="Supermercado Pompeia" />
          <div class="senhahub-auth-title">
            <span>Super Pompeia</span>
            <strong>SenhaHub</strong>
          </div>
        </div>

        <div class="senhahub-auth-copy">
          <p>Atendimento premium</p>
          <h1>Entre para acompanhar sua fila em tempo real.</h1>
        </div>

        <div class="senhahub-auth-features" aria-label="Recursos do sistema">
          <span>Senha por setor</span>
          <span>Ofertas exclusivas</span>
          <span>Painel da equipe</span>
        </div>
      </section>

      <section class="senhahub-auth-panel" aria-label="Acesso ao sistema">
        <div class="senhahub-auth-card">
          <p class="senhahub-auth-secure">Acesso seguro</p>

          <div class="senhahub-auth-heading">
            <h2>Acesse sua conta</h2>
            <p>Use seu e-mail e senha para entrar no SenhaHub.</p>
          </div>

          <div class="senhahub-auth-tabs login-tabs" role="tablist" aria-label="Acesso">
            <button class="active" type="button" data-login-panel="login">Entrar</button>
            <button type="button" data-login-panel="register">Criar conta</button>
            <button type="button" data-login-panel="password">Alterar senha</button>
            <button type="button" data-login-panel="recover">Recuperar senha</button>
          </div>

          <form class="login-panel active" id="loginForm">
            <label>
              E-mail
              <input name="email" type="email" autocomplete="username" placeholder="seuemail@superpompeia.com" required />
            </label>
            <label class="password-field">
              Senha
              <input name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <button class="yellow-action" data-online-required>Entrar</button>
            <button class="senhahub-auth-link" type="button" data-login-panel="recover">Esqueceu sua senha?</button>
            <p class="login-error" id="loginError"></p>
          </form>

          <form class="login-panel" id="registerForm">
            <label>
              Nome
              <input name="name" type="text" autocomplete="name" placeholder="Seu nome" minlength="2" required />
            </label>
            <label>
              E-mail
              <input name="email" type="email" autocomplete="username" placeholder="seuemail@superpompeia.com" required />
            </label>
            <label class="password-field">
              Senha
              <input name="password" type="password" autocomplete="new-password" placeholder="Crie uma senha segura" minlength="12" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <label class="password-field">
              Confirmar senha
              <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita a senha" minlength="12" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <button class="yellow-action" data-online-required>Criar conta de cliente</button>
            <p class="login-error" id="registerError"></p>
          </form>

          <form class="login-panel" id="passwordForm">
            <label>
              E-mail
              <input name="email" type="email" autocomplete="username" placeholder="seuemail@superpompeia.com" required />
            </label>
            <label class="password-field">
              Senha atual
              <input name="currentPassword" type="password" autocomplete="current-password" placeholder="Digite a senha atual" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <label class="password-field">
              Nova senha
              <input name="newPassword" type="password" autocomplete="new-password" placeholder="Digite a nova senha" minlength="12" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <button class="yellow-action" data-online-required>Salvar nova senha</button>
            <p class="login-error" id="passwordError"></p>
          </form>

          <form class="login-panel" id="recoverForm">
            <label>
              E-mail
              <input name="email" type="email" autocomplete="email" placeholder="seuemail@superpompeia.com" required />
            </label>
            <button class="yellow-action" data-online-required>Enviar link de recuperacao</button>
            <p class="login-error" id="recoverError"></p>
          </form>

          <form class="login-panel" id="resetForm">
            <label class="password-field">
              Nova senha
              <input name="newPassword" type="password" autocomplete="new-password" placeholder="Crie uma senha forte" minlength="12" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <label class="password-field">
              Confirmar nova senha
              <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita a senha" minlength="12" required />
              <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-password>Ver</button>
            </label>
            <button class="yellow-action" data-online-required>Redefinir senha</button>
            <p class="login-error" id="resetError"></p>
          </form>
        </div>
      </section>

      <div class="login-toast" id="loginToast" role="alert" aria-live="assertive"></div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
